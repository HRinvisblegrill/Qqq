<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><title>Admin | HR Invisible Safety Grill</title>
<link rel="stylesheet" href="../style.css">
<style>.am{max-width:760px;margin:auto;padding:14px 14px 120px}.af{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:5}.af span{font-size:.9rem;color:var(--mut)}.row small{color:var(--mut)}.note{background:var(--soft);border-radius:12px;padding:12px 14px;margin:12px 0}.note ol{margin:6px 0 0 18px;padding:0}</style></head>
<body><div class="am" id="ad"><p>Loading...</p></div>
<script>
const $=s=>document.querySelector(s),e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),sl=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const LS=k=>{try{return localStorage.getItem(k)||''}catch(_){return''}},SV=(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(_){}};
function guess(){const h=location.hostname,p=location.pathname.split('/').filter(Boolean);return h.endsWith('.github.io')?h.split('.')[0]+'/'+(p[0]&&p[0]!=='admin'?p[0]:h):''}
let C,AU,TOK=LS('hrt'),REPO=LS('hrr')||guess(),BR='main',UNL=0,FL=0,LK=0,AT='pages',ED=null,dirty=0,PEND={},DEL=[],NEWAU=null,FE=null;
const CT={grill:'Invisible grill',balcony:'Balcony nets',building:'Building nets',bird:'Bird protection',sports:'Sports and site nets',other:'Other'};
const GS=['','About','Products','Services','Industries','Resources','Locations','Blog'];
const pg=id=>C.pages.find(p=>p.id===id),gi=id=>C.gal.find(g=>g.id===id);
const ip=s=>PEND[s]?'data:image/webp;base64,'+PEND[s]:'../'+(C.imgs[s]||s);
const opt=(a,v)=>a.map(x=>`<option value="${e(x[0])}" ${x[0]===v?'selected':''}>${e(x[1])}</option>`).join('');
const hx=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const kd=async(pw,salt)=>hx(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(salt),iterations:100000},await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']),256));
const b64=s=>btoa(unescape(encodeURIComponent(s))),unb64=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
const api=(p,o={})=>fetch('https://api.github.com/'+p,{...o,headers:{Authorization:'Bearer '+TOK,Accept:'application/vnd.github+json','Content-Type':'application/json'}});
const getf=async p=>{const r=await api('repos/'+REPO+'/contents/'+p+'?ref='+BR);return r.ok?await r.json():null};
async function putf(p,c,msg){const f=await getf(p);const r=await api('repos/'+REPO+'/contents/'+p,{method:'PUT',body:JSON.stringify({message:msg,content:c,branch:BR,...(f?{sha:f.sha}:{})})});if(!r.ok)throw new Error((await r.json()).message||r.status)}
async function delf(p){const f=await getf(p);if(f)await api('repos/'+REPO+'/contents/'+p,{method:'DELETE',body:JSON.stringify({message:'Delete '+p,sha:f.sha,branch:BR})})}
async function connect(){const r=await api('repos/'+REPO);if(!r.ok)throw new Error('Cannot open the repository. Check the repository name and the token.');BR=(await r.json()).default_branch;const f=await getf('content.json');if(!f)throw new Error('content.json was not found in the repository.');C=JSON.parse(unb64(f.content));C.reviews=C.reviews||[];C.dim=C.dim||{}}
const shrink=f=>new Promise((res,rej)=>{const i=new Image();i.onerror=()=>rej(new Error('Could not read that image'));i.onload=()=>{const k=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res({u:c.toDataURL('image/webp',.82),w:c.width,h:c.height})};i.src=URL.createObjectURL(f)});
const V=h=>{$('#ad').innerHTML=h};
function login(msg){V(`<h1 style="font-size:1.6rem">Admin login</h1><label for="ap">Admin password</label><input id="ap" type="password" autocomplete="current-password" autofocus><p id="ae" style="color:#b3261e">${msg||''}</p><div class="cta"><button class="btn b2" data-a="lg">Unlock</button></div>`)}
function setup(msg){V(`<h1 style="font-size:1.6rem">Connect to GitHub</h1><p>One time only. This lets the admin save your changes to your website.</p><div class="note"><b>How to get a token</b><ol><li>Open GitHub, then Settings, then Developer settings, then Fine-grained tokens, then Generate new token.</li><li>Choose only your website repository.</li><li>Under Permissions, set <b>Contents</b> to <b>Read and write</b>.</li><li>Copy the token and paste it below.</li></ol></div><label for="rp">Repository (owner/name)</label><input id="rp" value="${e(REPO)}" placeholder="yourname/hr-invisible-safety-grill"><label for="tk">Token</label><input id="tk" type="password" autocomplete="off"><p style="color:#b3261e">${msg||''}</p><div class="cta"><button class="btn b2" data-a="cn">Connect</button></div>`)}
const AP=()=>{if(ED===null)return `<button class="btn b2" data-a="np">+ Add new page</button><p style="color:var(--mut);margin-top:10px">Tap Edit to change a page.</p>`+C.pages.map(p=>`<div class="row"><span>${e(p.t)} <small>(${p.g||'hidden menu'})</small></span><button class="btn b3 sm" data-a="ep" data-v="${p.id}">Edit</button>${['home','contact','gallery','faq','blog','locations','reviews','resources'].includes(p.id)?'':`<button class="btn dng sm" data-a="dp" data-v="${p.id}">Delete</button>`}</div>`).join('');
const p=ED==='new'?{id:'',t:'',g:'Services',d:'',b:'',i:'',mt:'',h:''}:pg(ED);return `<h2>${ED==='new'?'New page':'Edit page'}</h2><label>Page title</label><input id="pt" value="${e(p.t)}"><label>Google title (about 60 characters)</label><input id="pm" value="${e(p.mt||'')}"><label>Main heading (H1)</label><input id="ph" value="${e(p.h||'')}"><label>Menu</label><select id="pg">${opt(GS.map(x=>[x,x||'Not in menu']),p.g)}</select><label>Short description (shown at the top and on Google, about 150 characters)</label><textarea id="pd" rows="2">${e(p.d)}</textarea><label>Page text (one line = one paragraph; "- " starts a bullet, "## " a sub-heading, [text](#/page-id) a link)</label><textarea id="pb" rows="10">${e(p.b)}</textarea><label>Photo</label><select id="pi">${opt([['','No photo'],...C.gal.map(g=>[g.id,g.t])],p.i)}</select><div class="cta"><button class="btn b2" data-a="sp">Save page</button><button class="btn b3" data-a="cp">Cancel</button></div>`};
const AG=()=>`<h2>Add a photo</h2><label>Photo</label><input type="file" id="gf" accept="image/*"><label>Title</label><input id="gt"><label>Description</label><input id="gd"><label>Category</label><select id="gc">${opt(Object.entries(CT),'grill')}</select><label>Colour (optional)</label><input id="gk"><label>Fitted at (optional)</label><input id="gw"><div class="cta"><button class="btn b2" data-a="up">Add photo</button></div><h2 style="margin-top:20px">Your photos</h2>`+C.gal.map(g=>`<div class="row"><img src="${e(ip(g.s))}" alt="" style="width:54px;height:42px;object-fit:cover;border-radius:8px"><span>${e(g.t)}</span><button class="btn dng sm" data-a="dg" data-v="${e(g.id)}">Delete</button></div>`).join('');
const ARV=()=>`<h2>Add a review</h2><label>Customer name</label><input id="rn"><label>City</label><input id="rc"><label>Rating</label><select id="rr">${[5,4,3,2,1].map(n=>`<option value="${n}">${n} stars</option>`).join('')}</select><label>Review text</label><textarea id="rt" rows="3"></textarea><div class="cta"><button class="btn b2" data-a="ar">Add review</button></div><h2 style="margin-top:20px">Published reviews</h2>`+C.reviews.map(r=>`<div class="row"><span>${'★'.repeat(r.r)} ${e(r.n)}: ${e(r.t)}</span><button class="btn dng sm" data-a="dr" data-v="${r.id}">Delete</button></div>`).join('');
const AF=()=>`<h2>Add a question</h2><label>Question</label><input id="fq"><label>Answer</label><textarea id="fa" rows="3"></textarea><div class="cta"><button class="btn b2" data-a="af">Add question</button></div><h2 style="margin-top:20px">Questions</h2>`+C.faq.map((q,i)=>`<div class="row"><span>${e(q[0])}</span><button class="btn dng sm" data-a="df" data-v="${i}">Delete</button></div>`).join('');
const AI=()=>{const s=C.site;return `<h2>Business details</h2>${[['sn','Business name','name'],['sp','Phone (as shown)','phone'],['sw','WhatsApp number with country code, digits only','wa'],['se','Email','email'],['sa','Address','addr'],['sm','Google Maps link','map'],['sg','Google review link (optional)','greview']].map(f=>`<label>${f[1]}</label><input id="${f[0]}" value="${e(s[f[2]])}">`).join('')}<div class="cta"><button class="btn b2" data-a="ss">Apply</button></div><h2 style="margin-top:20px">Change admin password</h2><label for="npw">New password (8 or more characters)</label><input id="npw" type="password" autocomplete="new-password"><div class="cta"><button class="btn b3" data-a="cpw">Change password</button><button class="btn b3" data-a="lo">Disconnect GitHub on this device</button></div>`};
function A(){const T=[['pages','Pages'],['gallery','Photos'],['reviews','Reviews'],['faq','FAQ'],['info','Business info']];
V(`<div class="ah" style="display:flex;justify-content:space-between;align-items:center"><b>Admin panel</b><a class="btn b3 sm" href="../">View site</a></div><div class="tabs">${T.map(t=>`<button class="${t[0]===AT?'on':''}" data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>${AT==='pages'?AP():AT==='gallery'?AG():AT==='reviews'?ARV():AT==='faq'?AF():AI()}<div class="af"><span id="asv">${dirty?'Unsaved changes':'No changes'}</span><button class="btn b2" data-a="pub">Publish changes</button></div>`)}
async function pub(){const sv=$('#asv');try{for(const [p,d] of Object.entries(PEND)){sv.textContent='Uploading '+p;await putf(p,d,'Add photo '+p)}
for(const p of DEL){sv.textContent='Removing '+p;await delf(p)}
if(NEWAU)await putf('auth.json',b64(JSON.stringify(NEWAU)),'Change admin password');
sv.textContent='Saving content';await putf('content.json',b64(JSON.stringify(C,null,1)),'Update website content');
PEND={};DEL=[];NEWAU=null;dirty=0;A();$('#asv').textContent='Saved. The website updates in 1 to 2 minutes.';alert('Saved. The website updates in 1 to 2 minutes.')}catch(x){sv.textContent='Error: '+x.message;alert('Could not save: '+x.message)}}
document.addEventListener('click',async x=>{const b=x.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,G=i=>$('#'+i).value;
try{if(a==='lg'){if(Date.now()<LK){$('#ae').textContent='Too many tries. Wait one minute.';return}await new Promise(r=>setTimeout(r,600));if(await kd(G('ap'),AU.salt)===AU.hash){UNL=1;FL=0;return start()}if(++FL>=5){LK=Date.now()+60000;FL=0}return login('Wrong password. Try again.')}
if(!UNL)return;
if(a==='cn'){REPO=G('rp').trim().replace(/^https:\/\/github.com\//,'');TOK=G('tk').trim()||TOK;try{await connect()}catch(err){return setup(err.message)}SV('hrt',TOK);SV('hrr',REPO);return A()}
if(a==='lo'){SV('hrt','');TOK='';return setup()}
if(a==='tab'){AT=v;ED=null}else if(a==='np')ED='new';else if(a==='ep')ED=v;else if(a==='cp')ED=null;
else if(a==='dp'){if(!confirm('Delete this page?'))return;C.pages=C.pages.filter(p=>p.id!==v);dirty=1}
else if(a==='sp'){const t=G('pt').trim();if(!t){alert('Enter a title');return}const o={t,g:G('pg'),d:G('pd'),b:G('pb'),i:G('pi'),mt:G('pm').trim(),h:G('ph').trim()};if(ED==='new'){let id=sl(t),n=2;while(pg(id))id=sl(t)+'-'+n++;C.pages.push({id,...o})}else Object.assign(pg(ED),o);ED=null;dirty=1}
else if(a==='up'){const f=$('#gf').files[0],t=G('gt').trim();if(!f||!t){alert('Choose a photo and enter a title');return}const r=await shrink(f),path='img/u'+Date.now()+'.webp';PEND[path]=r.u.split(',')[1];C.dim[path]=[r.w,r.h];C.gal.unshift({id:'u'+Date.now(),s:path,t,d:G('gd'),c:G('gc'),k:G('gk'),w:G('gw')});dirty=1}
else if(a==='dg'){if(!confirm('Delete this photo?'))return;const g=gi(v);C.gal=C.gal.filter(y=>y.id!==v);C.pages.forEach(p=>{if(p.i===v)p.i=''});if(g&&g.s.startsWith('img/u')){if(PEND[g.s])delete PEND[g.s];else DEL.push(g.s)}dirty=1}
else if(a==='ar'){const n=G('rn').trim(),tx=G('rt').trim();if(!n||!tx){alert('Enter the name and the review text');return}C.reviews.unshift({id:'r'+Date.now(),n,c:G('rc'),r:+G('rr'),t:tx});dirty=1}
else if(a==='dr'){if(!confirm('Delete this review?'))return;C.reviews=C.reviews.filter(r=>r.id!==v);dirty=1}
else if(a==='af'){const q=G('fq').trim(),an=G('fa').trim();if(!q||!an){alert('Enter the question and the answer');return}C.faq.push([q,an]);dirty=1}
else if(a==='df'){if(!confirm('Delete this question?'))return;C.faq.splice(+v,1);dirty=1}
else if(a==='ss'){Object.assign(C.site,{name:G('sn'),phone:G('sp'),wa:G('sw').replace(/\D/g,''),email:G('se'),addr:G('sa'),map:G('sm'),greview:G('sg').trim()});dirty=1}
else if(a==='cpw'){const w=G('npw');if(w.length<8){alert('Use 8 or more characters');return}const salt=crypto.randomUUID();NEWAU={salt,hash:await kd(w,salt)};AU=NEWAU;dirty=1;alert('Password changed. Tap Publish changes to save it.')}
else if(a==='pub')return pub();
A()}catch(err){alert('Something went wrong: '+(err.message||err));A()}});
document.addEventListener('keydown',x=>{if(x.key==='Enter'&&x.target.id==='ap')$('[data-a=lg]').click()});
async function start(){if(!TOK||!REPO)return setup();try{await connect();A()}catch(err){setup(err.message)}}
(async()=>{try{AU=await (await fetch('auth.json',{cache:'no-store'})).json();login()}catch(_){V('<p>Could not load the admin settings. Please refresh the page.</p>')}})();
</script></body></html>
