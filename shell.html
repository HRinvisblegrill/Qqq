const AG=()=>`<h2>Add a photo</h2><label>Photo</label><input type="file" id="gf" accept="image/*"><label>Title</label><input id="gt"><label>Description</label><input id="gd"><label>Category</label><select id="gc">${opt(Object.entries(CT),'grill')}</select><label>Colour (optional)</label><input id="gk"><label>Fitted at (optional)</label><input id="gw"><div class="cta"><button class="btn b2" data-a="up">Upload photo</button></div><h2 style="margin-top:20px">Your photos</h2>`+st.gal.map(g=>`<div class="row">${img(g.s,g.t)}<span>${e(g.t)}</span><button class="btn dng sm" data-a="dg" data-v="${e(g.id)}">Delete</button></div>`).join('');
const AI=()=>{const s=S();return `<h2>Business details</h2>${[['sn','Business name','name'],['sp','Phone (as shown)','phone'],['sw','WhatsApp number with country code, digits only','wa'],['se','Email','email'],['sa','Address','addr'],['sm','Google Maps link','map'],['sg','Google review link (optional)','greview']].map(f=>`<label>${f[1]}</label><input id="${f[0]}" value="${e(s[f[2]])}">`).join('')}<div class="cta"><button class="btn b2" data-a="ss">Apply</button></div><h2 style="margin-top:20px">Change admin password</h2><label for="npw">New password (8 or more characters)</label><input id="npw" type="password" autocomplete="new-password"><div class="cta"><button class="btn b3" data-a="cpw">Change password</button></div><h2 style="margin-top:20px">Backup and restore</h2><div class="cta"><button class="btn b3" data-a="bk">Copy backup to clipboard</button></div><label for="rs">Paste a backup here to restore</label><textarea id="rs" rows="3"></textarea><div class="cta"><button class="btn b3" data-a="rs2">Restore backup</button></div>`};
const A=()=>{const o=$('#adm');o.innerHTML=`<div class="am"><div class="ah"><b>Admin panel</b><button class="btn b3 sm" data-a="x">Close</button></div><div class="tabs">${['pages','gallery','reviews','site'].map(t=>`<button class="${t===AT?'on':''}" data-a="tab" data-v="${t}">${t==='site'?'Business info':t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>${AT==='pages'?AP():AT==='gallery'?AG():AT==='reviews'?ARV():AI()}</div><div class="af"><span id="asv">${dirty?'Unsaved changes':'No changes'}</span><button class="btn b2" data-a="pub">Publish changes</button></div>`;o.classList.add('on')};
$('#adm').onclick=async x=>{const b=x.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,V=i=>$('#'+i).value;
try{if(a==='x'){$('#adm').classList.remove('on');route();return}
if(a==='tab'){AT=v;ED=null}
else if(a==='np')ED='new';else if(a==='ep')ED=v;else if(a==='cp')ED=null;
else if(a==='dp'){if(!confirm('Delete this page?'))return;st.pages=st.pages.filter(p=>p.id!==v);dirty=true}
else if(a==='sp'){const t=V('pt').trim();if(!t){alert('Enter a title');return}const o={t,g:V('pg'),d:V('pd'),b:V('pb'),i:V('pi'),mt:V('pm').trim(),h:V('ph').trim()};if(ED==='new'){let id=sl(t),n=2;while(pg(id))id=sl(t)+'-'+n++;st.pages.push({id,...o})}else Object.assign(pg(ED),o);ED=null;dirty=true}
else if(a==='up'){const f=$('#gf').files[0],t=V('gt').trim();if(!f||!t){alert('Choose a photo and enter a title');return}const as=await claude.use('assets');if(!as){alert('Photo upload is not available for this account');return}$('#asv').textContent='Uploading...';const r=await as.upload(await shrink(f));st.gal.unshift({id:'u'+Date.now(),s:r.url,a:r.id,t,d:V('gd'),c:V('gc'),k:V('gk'),w:V('gw')});dirty=true}
else if(a==='dg'){if(!confirm('Delete this photo?'))return;const g=gi(v);st.gal=st.gal.filter(y=>y.id!==v);st.pages.forEach(p=>{if(p.i===v)p.i=''});dirty=true;if(g&&g.a){try{(await claude.use('assets')).delete(g.a)}catch(_){}}}
else if(a==='lg'){if(Date.now()<LK){$('#ae').textContent='Too many tries. Wait one minute.';return}await new Promise(r=>setTimeout(r,700));if(await kd(V('ap'),st.auth.salt)===st.auth.hash){UNL=true;FL=0}else{if(++FL>=5){LK=Date.now()+60000;FL=0}$('#ae').textContent='Wrong password. Try again.';return}}
else if(a==='ar'){const n=V('rn').trim(),tx=V('rt').trim();if(!n||!tx){alert('Enter the name and the review text');return}(st.reviews=st.reviews||[]).unshift({id:'r'+Date.now(),n,c:V('rc'),r:+V('rr'),t:tx});dirty=true}
else if(a==='dr'){if(!confirm('Delete this review?'))return;st.reviews=st.reviews.filter(r=>r.id!==v);dirty=true}
else if(a==='cpw'){const w=V('npw');if(w.length<8){alert('Use 8 or more characters');return}const salt=crypto.randomUUID();st.auth={salt,hash:await kd(w,salt)};dirty=true;alert('Password changed. Tap Publish changes to save it.')}
else if(a==='bk'){await navigator.clipboard.writeText(JSON.stringify(st));alert('Backup copied. Paste it into a safe note or file.');return}
else if(a==='rs2'){let o;try{o=JSON.parse(V('rs'))}catch(_){alert('That is not a valid backup');return}if(!(o&&Array.isArray(o.pages)&&Array.isArray(o.gal)&&o.site&&o.imgs&&o.auth)){alert('That is not a valid backup');return}if(!confirm('Replace the whole site with this backup?'))return;st=o;dirty=true}
else if(a==='ss'){Object.assign(st.site,{name:V('sn'),phone:V('sp'),wa:V('sw').replace(/\D/g,''),email:V('se'),addr:V('sa'),map:V('sm'),greview:V('sg').trim()});dirty=true}
else if(a==='pub'){const ar=await claude.use('artifact');if(!ar){alert('Publishing is only available when you are signed in as the owner or editor of this site.');return}$('#asv').textContent='Publishing...';await ar.publish(shell());return}
A()}catch(err){alert('Something went wrong: '+(err.message||err.code||err));A()}};
(async()=>{try{if(typeof claude==='undefined')return;const u=await claude.use('user');if(u&&u.canEdit&&u.canEdit()){$('#adb').style.display='block';$('#adb').onclick=gate}}catch(_){}})();
</script></body></html>
